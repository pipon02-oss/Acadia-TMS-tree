<script>

// TREE_DATA_START

var treeData = {
  "id":1,
  "label":"TMS",
  "children":[
    {
      "id":2,
      "label":"Transport",
      "children":[
        {
          "id":4,
          "label":"Learning",
          "url":"https://google.com",
          "children":[]
        },
        {
          "id":5,
          "label":"Planning/projects",
          "children":[]
        }
      ]
    },
    {
      "id":3,
      "label":"Admin",
      "children":[
        {
          "id":6,
          "label":"Learning",
          "children":[]
        }
      ]
    }
  ]
};

// TREE_DATA_END

var COL_GAP = 40;
var V_GAP   = 14;
var PAD_X   = 60;
var PAD_Y   = 60;
var NODE_H  = 36;
var nextId  = 1000;

var svg      = document.getElementById('svg-layer');
var nodesDiv = document.getElementById('nodes-layer');
var wrap     = document.getElementById('canvas-wrap');
var sizer    = document.getElementById('sizer');

function measureText(text, lv) {
  sizer.style.fontSize = (lv===0?16:14)+'px';
  sizer.textContent = text || ' ';
  return sizer.offsetWidth + 130;
}

function fitInput(inp, lv) {
  sizer.style.fontSize = (lv===0?16:14)+'px';
  sizer.textContent = inp.value || ' ';
  inp.style.width = Math.max(sizer.offsetWidth,20)+'px';
}

function allNodes(n,a){
  a=a||[];
  a.push(n);
  n.children.forEach(function(c){
    allNodes(c,a);
  });
  return a;
}

function cloneTree(n){
  return {
    id:n.id,
    label:n.label,
    url:n.url || '',
    children:n.children.map(cloneTree)
  };
}

function removeNode(n,id){
  n.children=n.children.filter(function(c){
    return c.id!==id;
  });

  n.children.forEach(function(c){
    removeNode(c,id);
  });
}

function collectLevelWidths(n, lv, map) {
  var w = measureText(n.label, lv);

  map[lv] = Math.max(map[lv]||0, w);

  n.children.forEach(function(c){
    collectLevelWidths(c, lv+1, map);
  });
}

function buildColX(map) {
  var colX = [PAD_X];

  var maxLv = Object.keys(map).length;

  for (var lv=1; lv<maxLv; lv++) {
    colX[lv] = colX[lv-1] + (map[lv-1]||0) + COL_GAP;
  }

  return colX;
}

function calcSubtreeHeight(n) {

  if (!n.children.length){
    n._sh=NODE_H;
    return;
  }

  n.children.forEach(calcSubtreeHeight);

  var total=n.children.reduce(function(s,c){
    return s+c._sh;
  },0)+V_GAP*(n.children.length-1);

  n._sh=Math.max(NODE_H,total);
}

function placeNodes(n, lv, yTop, colX) {

  n._lv = lv;
  n._x = colX[lv];
  n._cy = yTop + n._sh/2;

  if (!n.children.length) return;

  var y = yTop;

  n.children.forEach(function(c){
    placeNodes(c, lv+1, y, colX);
    y += c._sh + V_GAP;
  });
}

function render() {

  nodesDiv.innerHTML='';
  svg.innerHTML='';

  var lvWidths = {};

  collectLevelWidths(treeData,0,lvWidths);

  var colX = buildColX(lvWidths);

  calcSubtreeHeight(treeData);

  placeNodes(treeData,0,PAD_Y,colX);

  var nodes = allNodes(treeData);

  var maxLv = Object.keys(lvWidths).length - 1;

  var maxX =
    (colX[maxLv] || PAD_X) +
    (lvWidths[maxLv] || 200) +
    PAD_X;

  var maxY = 0;

  nodes.forEach(function(n){
    maxY=Math.max(maxY,n._cy+NODE_H/2+PAD_Y);
  });

  nodesDiv.style.width=maxX+'px';
  nodesDiv.style.height=maxY+'px';

  svg.setAttribute('width',maxX);
  svg.setAttribute('height',maxY);

  wrap.style.height=Math.min(
    maxY+4,
    window.innerHeight-200
  )+'px';

  nodes.forEach(function(node){

    var lv = Math.min(node._lv,4);

    var el = document.createElement('div');

    el.className='node lv'+lv;

    el.setAttribute('data-id',node.id);

    el.style.left=node._x+'px';
    el.style.top='-9999px';

    // INPUT

    var inp=document.createElement('input');

    inp.className='node-input';

    inp.value=node.label;

    fitInput(inp,node._lv);

    inp.addEventListener('input',(function(n,i){

      return function(){

        n.label=i.value;

        fitInput(i,n._lv);

        requestAnimationFrame(function(){
          requestAnimationFrame(repositionAndRedraw);
        });

      };

    })(node,inp));

    // LINK BUTTON

    var btnLink=document.createElement('button');

    btnLink.className='btn';

    btnLink.innerHTML='🔗';

    btnLink.title='Open / Edit link';

    btnLink.style.opacity=node.url?'1':'0.4';

    btnLink.addEventListener('click',(function(n,btn){

      return function(e){

        e.stopPropagation();

        if(n.url){

          var openNow = confirm(
            'Open existing link?\n\n' +
            'Press OK to open.\n' +
            'Press Cancel to edit.'
          );

          if(openNow){
            window.open(n.url,'_blank');
            return;
          }
        }

        var newUrl = prompt(
          'Enter URL (leave empty to remove):',
          n.url || ''
        );

        if(newUrl===null) return;

        newUrl = newUrl.trim();

        if(newUrl===''){

          delete n.url;

          btn.style.opacity='0.4';

          return;
        }

        if(!/^https?:\/\//i.test(newUrl)){
          newUrl='https://'+newUrl;
        }

        n.url=newUrl;

        btn.style.opacity='1';

      };

    })(node,btnLink));

    // ADD BUTTON

    var btnAdd=document.createElement('button');

    btnAdd.className='btn btn-add';

    btnAdd.textContent='＋';

    btnAdd.title='Add child';

    btnAdd.addEventListener('click',(function(n){

      return function(){

        n.children.push({
          id: nextId++,
          label: 'New Item',
          url: '',
          children: []
        });

        render();

      };

    })(node));

    // DELETE BUTTON

    var btnDel=document.createElement('button');

    btnDel.className='btn btn-del';

    btnDel.textContent='×';

    btnDel.title='Delete';

    btnDel.style.display=node.id===treeData.id?'none':'';

    btnDel.addEventListener('click',(function(n){

      return function(){

        if(n.id===treeData.id) return;

        removeNode(treeData,n.id);

        render();

      };

    })(node));

    el.appendChild(inp);
    el.appendChild(btnLink);
    el.appendChild(btnAdd);
    el.appendChild(btnDel);

    nodesDiv.appendChild(el);

  });

  requestAnimationFrame(function(){

    nodes.forEach(function(node){

      var el=nodesDiv.querySelector(
        '[data-id="'+node.id+'"]'
      );

      if(!el) return;

      el.style.top=
        (node._cy - el.offsetHeight/2)+'px';

    });

    requestAnimationFrame(drawLines);

  });

}

function repositionAndRedraw(){

  var lvWidths={};

  collectLevelWidths(treeData,0,lvWidths);

  var colX=buildColX(lvWidths);

  calcSubtreeHeight(treeData);

  placeNodes(treeData,0,PAD_Y,colX);

  var nodes=allNodes(treeData);

  nodes.forEach(function(node){

    var el=nodesDiv.querySelector(
      '[data-id="'+node.id+'"]'
    );

    if(!el) return;

    el.style.left=node._x+'px';

    el.style.top=
      (node._cy-el.offsetHeight/2)+'px';

  });

  drawLines();
}

function drawLines(){

  svg.innerHTML='';

  function getCoords(node){

    var el=nodesDiv.querySelector(
      '[data-id="'+node.id+'"]'
    );

    if(!el) return null;

    var left=parseFloat(el.style.left);

    var top=parseFloat(el.style.top);

    return {
      lx:left,
      rx:left+el.offsetWidth,
      cy:top+el.offsetHeight/2
    };

  }

  function edges(node){

    if(!node.children.length) return;

    var pr=getCoords(node);

    if(!pr) return;

    var crs=node.children.map(getCoords).filter(Boolean);

    if(!crs.length) return;

    var midX=pr.rx+(crs[0].lx-pr.rx)/2;

    line(pr.rx,pr.cy,midX,pr.cy);

    if(crs.length===1){

      line(midX,crs[0].cy,crs[0].lx,crs[0].cy);

    } else {

      line(midX,crs[0].cy,midX,crs[crs.length-1].cy);

      crs.forEach(function(cr){
        line(midX,cr.cy,cr.lx,cr.cy);
      });

    }

    node.children.forEach(edges);

  }

  edges(treeData);

}

function line(x1,y1,x2,y2){

  var l=document.createElementNS(
    'http://www.w3.org/2000/svg',
    'line'
  );

  l.setAttribute('x1',x1);
  l.setAttribute('y1',y1);

  l.setAttribute('x2',x2);
  l.setAttribute('y2',y2);

  l.setAttribute('stroke','#94a3b8');
  l.setAttribute('stroke-width','2');
  l.setAttribute('stroke-linecap','round');

  svg.appendChild(l);

}

function buildExport(){

  var tree=JSON.stringify(cloneTree(treeData));

  var xhr=new XMLHttpRequest();

  xhr.open('GET',window.location.href,false);

  try{

    xhr.send();

    if(xhr.status===200){

      return xhr.responseText.replace(
        /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
        '// TREE_DATA_START\nvar treeData = '+tree+';\n// TREE_DATA_END'
      );

    }

  } catch(e){}

  return document.documentElement.outerHTML;

}

function flash(id){

  var el=document.getElementById(id);

  el.style.opacity='1';

  setTimeout(function(){
    el.style.opacity='0';
  },2000);

}

document.getElementById('btn-save').addEventListener('click',function(){

  var blob=new Blob(
    [buildExport()],
    {type:'text/html'}
  );

  var a=document.createElement('a');

  a.href=URL.createObjectURL(blob);

  a.download='tms_tree.html';

  a.click();

  flash('save-msg');

});

document.getElementById('btn-copy').addEventListener('click',function(){

  navigator.clipboard.writeText(buildExport())
    .then(function(){
      flash('copy-msg');
    });

});

document.getElementById('btn-snap').addEventListener('click', function(){

  var btns=nodesDiv.querySelectorAll('.btn');

  btns.forEach(function(b){
    b.style.display='none';
  });

  html2canvas(wrap,{
    backgroundColor:'#f0f4f8',
    scale:2,
    useCORS:true
  }).then(function(canvas){

    btns.forEach(function(b){
      b.style.display='';
    });

    var a=document.createElement('a');

    a.download='TMS_tree.png';

    a.href=canvas.toDataURL('image/png');

    a.click();

    flash('snap-msg');

  });

});

wrap.addEventListener('scroll', drawLines);

window.addEventListener('resize', render);

render();

</script>


</body></html>
