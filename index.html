<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 30px 20px; }

  h1 { text-align: center; color: #1e3a5f; margin-bottom: 6px; font-size: 22px; }
  .subtitle { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 14px; }
  .subtitle span { margin: 0 10px; }

  #toolbar { text-align: center; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }

  .tool-btn {
    border: none; border-radius: 8px;
    padding: 9px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: background 0.15s, transform 0.1s;
  }
  .tool-btn:active { transform: scale(0.97); }
  #btn-save { background: #1e3a5f; color: #fff; }
  #btn-save:hover { background: #2563eb; }
  #btn-copy { background: #fff; color: #1e3a5f; border: 2px solid #3b82f6; }
  #btn-copy:hover { background: #eff6ff; }

  .flash-msg { font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; min-width: 90px; }
  #save-msg { color: #16a34a; }
  #copy-msg { color: #2563eb; }

  #canvas-wrap { position: relative; overflow: auto; }
  #svg-layer   { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  #nodes-layer { position: relative; }

  .node {
    position: absolute;
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 10px; padding: 8px 13px;
    font-weight: 600; font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    white-space: nowrap;
    transform: translateX(-50%);
  }
  .lv0 { background:#1e3a5f; color:#fff; font-size:16px; padding:10px 20px; }
  .lv1 { background:#2563eb; color:#fff; }
  .lv2 { background:#fff; color:#1e3a5f; border:2px solid #3b82f6; }
  .lv3 { background:#f0fdf4; color:#166534; border:2px solid #4ade80; font-weight:500; }
  .lv4 { background:#fefce8; color:#713f12; border:2px solid #facc15; font-weight:500; }

  .node-input {
    border: none; outline: none; background: transparent;
    color: inherit; font: inherit; text-align: center; min-width: 30px;
  }
  .node-input:focus { border-bottom: 1px dashed rgba(255,255,255,0.5); }
  .lv2 .node-input:focus, .lv3 .node-input:focus, .lv4 .node-input:focus { border-bottom-color: #3b82f6; }

  .btn { background:none; border:none; cursor:pointer; font-size:14px; padding:1px 3px; border-radius:4px; line-height:1; opacity:0.7; }
  .btn:hover { opacity:1; }
  .btn-add { color:#86efac; }
  .lv2 .btn-add, .lv3 .btn-add, .lv4 .btn-add { color:#2563eb; }
  .btn-del { color:#fca5a5; }
  .lv2 .btn-del, .lv3 .btn-del, .lv4 .btn-del { color:#ef4444; }

<script>
// TREE_DATA_START
const root = {"id":1,"label":"TMS","children":[{"id":2,"label":"Transport","children":[{"id":4,"label":"Learning","children":[]},{"id":5,"label":"Planning/projects","children":[]}]},{"id":3,"label":"Admin","children":[{"id":6,"label":"Learning","children":[{"id":10,"label":"Onboarding","children":[]}]},{"id":7,"label":"Projects","children":[]},{"id":8,"label":"Dashboards","children":[]}]},{"id":9,"label":"Technical Documentation","children":[]}]};
// TREE_DATA_END

const V_GAP = 90, H_GAP = 50, PAD = 80;
let uid = 200;

const svgEl      = document.getElementById('svg-layer');
const nodesLayer = document.getElementById('nodes-layer');
const canvasWrap = document.getElementById('canvas-wrap');
const domMap     = new Map();

// ── Data helpers ──────────────────────────────────────────────────────────────
function deleteById(node, id) {
  node.children = node.children.filter(c => c.id !== id);
  node.children.forEach(c => deleteById(c, id));
}
function traverse(node, fn) { fn(node); node.children.forEach(c => traverse(c, fn)); }
function clean(node) { return { id: node.id, label: node.label, children: node.children.map(clean) }; }

// ── Layout ────────────────────────────────────────────────────────────────────
const _ctx = document.createElement('canvas').getContext('2d');
function textWidth(label, level) {
  _ctx.font = `600 ${level === 0 ? 16 : 14}px Segoe UI, Tahoma, sans-serif`;
  return _ctx.measureText(label).width + (level === 0 ? 60 : 50);
}
function calcSubtreeWidth(node, level) {
  node._level = level;
  node._ownW  = textWidth(node.label, level);
  if (!node.children.length) { node._subtreeW = node._ownW; return; }
  node.children.forEach(c => calcSubtreeWidth(c, level + 1));
  const span = node.children.reduce((s, c) => s + c._subtreeW, 0) + H_GAP * (node.children.length - 1);
  node._subtreeW = Math.max(node._ownW, span);
}
function assignXY(node, cx, y) {
  node._x = cx; node._y = y;
  if (!node.children.length) return;
  const span = node.children.reduce((s, c) => s + c._subtreeW, 0) + H_GAP * (node.children.length - 1);
  let x = cx - span / 2;
  node.children.forEach(c => { assignXY(c, x + c._subtreeW / 2, y + V_GAP); x += c._subtreeW + H_GAP; });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  calcSubtreeWidth(root, 0);
  assignXY(root, 0, 0);

  let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
  traverse(root, n => {
    minX = Math.min(minX, n._x - n._subtreeW / 2);
    maxX = Math.max(maxX, n._x + n._subtreeW / 2);
    maxY = Math.max(maxY, n._y);
  });
  const shiftX = PAD - minX;
  traverse(root, n => { n._x += shiftX; });

  const totalW = maxX - minX + PAD * 2;
  const totalH = maxY + 80 + PAD;

  nodesLayer.style.width  = totalW + 'px';
  nodesLayer.style.height = totalH + 'px';
  svgEl.setAttribute('width',  totalW);
  svgEl.setAttribute('height', totalH);
  canvasWrap.style.height = (totalH + 4) + 'px';

  const seen = new Set();
  traverse(root, node => {
    seen.add(node.id);
    let entry = domMap.get(node.id);
    if (!entry) {
      const el = buildEl(node);
      nodesLayer.appendChild(el);
      entry = { el, node };
      domMap.set(node.id, entry);
    }
    const { el } = entry;
    const inp = el.querySelector('.node-input');
    if (document.activeElement !== inp) { inp.value = node.label; autoWidth(inp); }
    el.className = `node lv${Math.min(node._level, 4)}`;
    const del = el.querySelector('.btn-del');
    if (del) del.style.display = node.id === root.id ? 'none' : '';
    el.style.left = node._x + 'px';
    el.style.top  = node._y + 'px';
  });

  domMap.forEach((entry, id) => { if (!seen.has(id)) { entry.el.remove(); domMap.delete(id); } });

  // Two rAF frames to ensure DOM has fully painted before reading rects
  requestAnimationFrame(() => requestAnimationFrame(drawLines));
}

function buildEl(node) {
  const el = document.createElement('div');
  const inp = document.createElement('input');
  inp.className = 'node-input';
  inp.value = node.label;
  autoWidth(inp);
  inp.addEventListener('input', () => { node.label = inp.value; autoWidth(inp); render(); });

  const btnAdd = document.createElement('button');
  btnAdd.className = 'btn btn-add'; btnAdd.textContent = '＋'; btnAdd.title = 'Add child';
  btnAdd.addEventListener('click', () => {
    node.children.push({ id: uid++, label: 'New Item', children: [] });
    render();
    setTimeout(() => { const all = document.querySelectorAll('.node-input'); all[all.length-1]?.focus(); }, 60);
  });

  const btnDel = document.createElement('button');
  btnDel.className = 'btn btn-del'; btnDel.textContent = '×'; btnDel.title = 'Delete';
  btnDel.addEventListener('click', () => { if (node.id === root.id) return; deleteById(root, node.id); render(); });

  el.append(inp, btnAdd, btnDel);
  return el;
}

function autoWidth(inp) { inp.style.width = '0'; inp.style.width = (inp.scrollWidth + 2) + 'px'; }

// ── SVG connectors — reads REAL bounding rects after paint ───────────────────
function drawLines() {
  svgEl.innerHTML = '';
  const wrapRect = canvasWrap.getBoundingClientRect();
  const sx = canvasWrap.scrollLeft, sy = canvasWrap.scrollTop;

  function getRect(node) {
    const el = domMap.get(node.id)?.el;
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return {
      cx:  r.left - wrapRect.left + r.width / 2 + sx,
      top: r.top  - wrapRect.top               + sy,
      bot: r.top  - wrapRect.top  + r.height   + sy,
    };
  }

  function drawEdges(node) {
    if (!node.children.length) return;
    const pr = getRect(node); if (!pr) return;
    const crs = node.children.map(c => getRect(c)).filter(Boolean);
    if (!crs.length) return;

    const midY = pr.bot + (crs[0].top - pr.bot) / 2;

    // vertical stem down from parent
    seg(pr.cx, pr.bot, pr.cx, midY);

    if (crs.length === 1) {
      seg(pr.cx, midY, crs[0].cx, crs[0].top);
    } else {
      // horizontal bar only between first and last child of THIS node
      seg(crs[0].cx, midY, crs[crs.length - 1].cx, midY);
      // vertical drop to each child
      crs.forEach(cr => seg(cr.cx, midY, cr.cx, cr.top));
    }

    // recurse — each node draws only its own children's connectors
    node.children.forEach(drawEdges);
  }

  drawEdges(root);
}

function seg(x1, y1, x2, y2) {
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  l.setAttribute('stroke', '#94a3b8'); l.setAttribute('stroke-width', '2');
  l.setAttribute('stroke-linecap', 'round');
  svgEl.appendChild(l);
}

// ── Generate updated HTML ─────────────────────────────────────────────────────
function getUpdatedHTML() {
  const treeJson = JSON.stringify(clean(root));
  return document.documentElement.outerHTML.replace(
    /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
    `// TREE_DATA_START\nconst root = ${treeJson};\n// TREE_DATA_END`
  );
}

// ── Save as file ──────────────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', () => {
  const blob = new Blob([getUpdatedHTML()], { type: 'text/html' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'tms_tree.html'; a.click();
  URL.revokeObjectURL(url);
  flash('save-msg');
});

// ── Copy to clipboard ─────────────────────────────────────────────────────────
document.getElementById('btn-copy').addEventListener('click', () => {
  navigator.clipboard.writeText(getUpdatedHTML()).then(() => flash('copy-msg'));
});

function flash(id) {
  const el = document.getElementById(id);
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
render();
window.addEventListener('resize', render);
canvasWrap.addEventListener('scroll', drawLines);
</script>
