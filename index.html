<!DOCTYPE html>
<html lang="en" wm-editor-extension-available="true"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS Project Tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Segoe UI',Tahoma,sans-serif; background:#f0f4f8; min-height:100vh; padding:30px 20px; }
h1{ text-align:center; color:#1e3a5f; margin-bottom:6px; font-size:22px; }
.subtitle{ text-align:center; font-size:12px; color:#64748b; margin-bottom:14px; }
.subtitle span{ margin:0 10px; }
#toolbar{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
.tool-btn{ border:none; border-radius:8px; padding:9px 20px; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
#btn-save{ background:#1e3a5f; color:#fff; } #btn-save:hover{ background:#2563eb; }
#btn-copy{ background:#fff; color:#1e3a5f; border:2px solid #3b82f6; } #btn-copy:hover{ background:#eff6ff; }
#btn-snap{ background:#7c3aed; color:#fff; } #btn-snap:hover{ background:#6d28d9; }
.flash{ font-size:13px; font-weight:600; opacity:0; transition:opacity .3s; }
#save-msg{ color:#16a34a; } #copy-msg{ color:#2563eb; } #snap-msg{ color:#7c3aed; }

/* Legend */
#legend{ text-align:center; font-size:12px; color:#64748b; margin-bottom:20px; display:flex; align-items:center; justify-content:center; gap:20px; }
.legend-dot{ display:inline-flex; align-items:center; gap:6px; }
.legend-box{ width:18px; height:18px; border-radius:5px; display:inline-block; }
.legend-box.linked   { background:#fff; border:2px solid #3b82f6; }
.legend-box.unlinked { background:#fff; border:2px solid #cbd5e1; }

#canvas-wrap{ position:relative; overflow:auto; }
#svg-layer{ position:absolute; top:0; left:0; pointer-events:none; }
#nodes-layer{ position:relative; }
.node{ position:absolute; display:inline-flex; align-items:center; gap:5px; border-radius:10px; padding:7px 12px; font-weight:600; font-size:14px; box-shadow:0 2px 8px rgba(0,0,0,0.12); white-space:nowrap; }

/* Level 0 & 1 — dark/blue backgrounds, no border change needed */
.lv0{ background:#1e3a5f; color:#fff; font-size:16px; padding:10px 18px; }
.lv1{ background:#2563eb; color:#fff; }

/* Level 2 — white nodes */
.lv2         { background:#fff; color:#1e3a5f; border:2px solid #3b82f6; }
.lv2.no-link { background:#fff; color:#1e3a5f; border:2px solid #cbd5e1; }

/* Level 3 — green nodes */
.lv3         { background:#f0fdf4; color:#166634; border:2px solid #4ade80; }
.lv3.no-link { background:#f0fdf4; color:#166634; border:2px solid #bbf7d0; }

/* Level 4 — yellow nodes */
.lv4         { background:#fefce8; color:#713f12; border:2px solid #facc15; }
.lv4.no-link { background:#fefce8; color:#713f12; border:2px solid #fef08a; }

.node-input{ border:none; outline:none; background:transparent; color:inherit; font:inherit; text-align:center; min-width:20px; width:auto; }
.node-input:focus{ border-bottom:1px dashed rgba(255,255,255,0.5); }
.lv2 .node-input:focus,.lv3 .node-input:focus,.lv4 .node-input:focus{ border-bottom-color:#3b82f6; }
.btn{ background:none; border:none; cursor:pointer; font-size:13px; padding:1px 4px; border-radius:4px; opacity:.75; line-height:1; }
.btn:hover{ opacity:1; }
.btn-add{ color:#86efac; }
.lv2 .btn-add,.lv3 .btn-add,.lv4 .btn-add{ color:#2563eb; }
.btn-del{ color:#fca5a5; }
.lv2 .btn-del,.lv3 .btn-del,.lv4 .btn-del{ color:#ef4444; }
#sizer{ position:absolute; visibility:hidden; white-space:pre; font-weight:600; font-size:14px; font-family:'Segoe UI',Tahoma,sans-serif; top:-9999px; left:-9999px; }
</style>
</head>
<body>
<h1>📋 TMS Project Tree</h1>
<div class="subtitle">
  <span>✏️ Rename node</span>
  <span>🔗 Add/Open links</span>
  <span>➕ Add child</span>
  <span>🗑️ Delete node</span>
</div>
<div id="legend">
  <div class="legend-dot"><span class="legend-box linked"></span> Has link</div>
  <div class="legend-dot"><span class="legend-box unlinked"></span> No link</div>
</div>
<div id="toolbar">
  <button class="tool-btn" id="btn-save">💾 Save as file</button>
  <span class="flash" id="save-msg">✓ Downloaded!</span>
  <button class="tool-btn" id="btn-copy">📋 Copy to clipboard</button>
  <span class="flash" id="copy-msg" style="opacity: 0;">✓ Copied!</span>
  <button class="tool-btn" id="btn-snap">📸 Export as image</button>
  <span class="flash" id="snap-msg" style="opacity: 0;">✓ Image saved!</span>
</div>
<div id="canvas-wrap" style="height: 711px;">
  <svg id="svg-layer" width="1489" height="1356"></svg>
  <div id="nodes-layer" style="width: 1489px; height: 1356px;"></div>
</div>
<span id="sizer" style="font-size: 14px;">Admin</span>

<script>
// TREE_DATA_START
var treeData = {"id":1,"label":"TMS","url":"","children":[{"id":2,"label":"Transport","url":"","children":[{"id":4,"label":"Learning","url":"","children":[{"id":101,"label":"Onboarding","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500757/en-us","children":[]}]},{"id":5,"label":"Planning/projects","url":"","children":[{"id":122,"label":"NO_NER","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500805/en-us","children":[]},{"id":123,"label":"RUSH","url":"","children":[]},{"id":124,"label":"Trailer Activities UK","url":"","children":[]}]},{"id":125,"label":"JOBSERVER","url":"","children":[]}]},{"id":3,"label":"Admin","url":"","children":[{"id":6,"label":"Learning","url":"","children":[{"id":106,"label":"Onboarding","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500802/en-us","children":[]},{"id":121,"label":"Extra Charges + Stops","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500766/en-us","children":[]},{"id":144,"label":"Distance and Fuel Surcharge","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500776/en-us","children":[]},{"id":145,"label":"Tariff and Master Data","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500780/en-us","children":[]},{"id":147,"label":"Rating Issues guide","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500792/en-us","children":[]},{"id":148,"label":"Self Billing issues and output","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500796/en-us","children":[]},{"id":149,"label":"Billing Proposal guide","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500799/en-us","children":[]},{"id":151,"label":"Zone Creation via Template","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500801/en-us","children":[]}]},{"id":107,"label":"Projects","url":"","children":[]},{"id":108,"label":"Dashboards","url":"","children":[]}]},{"id":128,"label":"Technical Documentation","url":"","children":[{"id":129,"label":"System","url":"","children":[{"id":132,"label":"Optimization","url":"","children":[{"id":133,"label":"Strategy","url":"","children":[]},{"id":134,"label":"Parameters","url":"","children":[]}]}]},{"id":130,"label":"TP","url":"","children":[{"id":135,"label":"SPOTBUY Process Map","url":"","children":[{"id":136,"label":"TMS","url":"","children":[]},{"id":137,"label":"TNX","url":"","children":[]}]},{"id":138,"label":"LC","url":"","children":[]},{"id":139,"label":"DVA","url":"","children":[]},{"id":140,"label":"DF","url":"","children":[]},{"id":141,"label":"Multidrops","url":"","children":[{"id":142,"label":"GE","url":"","children":[]},{"id":143,"label":"UK","url":"","children":[]}]}]},{"id":131,"label":"Admin","url":"","children":[]}]}]};
// TREE_DATA_END

var COL_GAP=40, V_GAP=14, PAD_X=60, PAD_Y=60, NODE_H=36;
var nextId = 200;
var svg=document.getElementById('svg-layer');
var nodesDiv=document.getElementById('nodes-layer');
var wrap=document.getElementById('canvas-wrap');
var sizer=document.getElementById('sizer');

var _uidCounter=1;
function ensureUids(n){ if(!n._uid) n._uid='u'+(_uidCounter++); n.children.forEach(ensureUids); }
ensureUids(treeData);
function maxId(n){ var m=n.id; n.children.forEach(function(c){ m=Math.max(m,maxId(c)); }); return m; }
nextId=maxId(treeData)+1;

function measureText(text,lv){ sizer.style.fontSize=(lv===0?16:14)+'px'; sizer.textContent=text||' '; return sizer.offsetWidth+130; }
function fitInput(inp,lv){ sizer.style.fontSize=(lv===0?16:14)+'px'; sizer.textContent=inp.value||' '; inp.style.width=Math.max(sizer.offsetWidth,20)+'px'; }
function allNodes(n,a){ a=a||[]; a.push(n); n.children.forEach(function(c){ allNodes(c,a); }); return a; }
function cloneTree(n){ return {id:n.id,label:n.label,url:n.url||'',children:n.children.map(cloneTree)}; }
function removeNode(n,id){ n.children=n.children.filter(function(c){ return c.id!==id; }); n.children.forEach(function(c){ removeNode(c,id); }); }
function collectLevelWidths(n,lv,map){ map[lv]=Math.max(map[lv]||0,measureText(n.label,lv)); n.children.forEach(function(c){ collectLevelWidths(c,lv+1,map); }); }
function buildColX(map){ var colX=[PAD_X],maxLv=Object.keys(map).length; for(var lv=1;lv<maxLv;lv++) colX[lv]=colX[lv-1]+(map[lv-1]||0)+COL_GAP; return colX; }
function calcSubtreeHeight(n){ if(!n.children.length){ n._sh=NODE_H; return; } n.children.forEach(calcSubtreeHeight); var total=n.children.reduce(function(s,c){ return s+c._sh; },0)+V_GAP*(n.children.length-1); n._sh=Math.max(NODE_H,total); }
function placeNodes(n,lv,yTop,colX){ n._lv=lv; n._x=colX[lv]; n._cy=yTop+n._sh/2; if(!n.children.length) return; var y=yTop; n.children.forEach(function(c){ placeNodes(c,lv+1,y,colX); y+=c._sh+V_GAP; }); }

function render(){
  nodesDiv.innerHTML=''; svg.innerHTML='';
  var lvWidths={};
  collectLevelWidths(treeData,0,lvWidths);
  var colX=buildColX(lvWidths);
  calcSubtreeHeight(treeData);
  placeNodes(treeData,0,PAD_Y,colX);
  var nodes=allNodes(treeData);
  var maxLv=Object.keys(lvWidths).length-1;
  var maxX=(colX[maxLv]||PAD_X)+(lvWidths[maxLv]||200)+PAD_X;
  var maxY=0;
  nodes.forEach(function(n){ maxY=Math.max(maxY,n._cy+NODE_H/2+PAD_Y); });
  nodesDiv.style.width=maxX+'px'; nodesDiv.style.height=maxY+'px';
  svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  wrap.style.height=Math.min(maxY+4,window.innerHeight-200)+'px';

  nodes.forEach(function(node){
    var lv=Math.min(node._lv,4);
    var el=document.createElement('div');
    // Apply no-link class for levels 2+ that have no URL
    var noLinkClass = (lv>=2 && !node.url) ? ' no-link' : '';
    el.className='node lv'+lv+noLinkClass;
    el.setAttribute('data-uid',node._uid);
    el.style.left=node._x+'px';
    el.style.top='-9999px';

    var inp=document.createElement('input');
    inp.className='node-input'; inp.value=node.label;
    fitInput(inp,node._lv);
    inp.addEventListener('input',(function(n,i){ return function(){
      n.label=i.value; fitInput(i,n._lv);
      requestAnimationFrame(function(){ requestAnimationFrame(repositionAndRedraw); });
    }; })(node,inp));

    var btnLink=document.createElement('button');
    btnLink.className='btn'; btnLink.innerHTML='🔗'; btnLink.title='Open / Edit link';
    btnLink.style.opacity=node.url?'1':'0.4';
    btnLink.addEventListener('click',(function(n,btn){ return function(e){
      e.stopPropagation();
      if(n.url){
        var openNow=confirm('Open existing link?\n\nOK = open link\nCancel = edit link');
        if(openNow){ window.open(n.url,'_blank'); return; }
      }
      var newUrl=prompt('Enter URL (leave empty to remove):',n.url||'');
      if(newUrl===null) return;
      newUrl=newUrl.trim();
      if(newUrl===''){ n.url=''; btn.style.opacity='0.4'; render(); return; }
      if(!/^https?:\/\//i.test(newUrl)) newUrl='https://'+newUrl;
      n.url=newUrl; btn.style.opacity='1'; render();
    }; })(node,btnLink));

    var btnAdd=document.createElement('button');
    btnAdd.className='btn btn-add'; btnAdd.textContent='＋'; btnAdd.title='Add child';
    btnAdd.addEventListener('click',(function(n){ return function(){
      var newNode={id:nextId++,label:'New Item',url:'',children:[]};
      ensureUids(newNode);
      n.children.push(newNode);
      render();
    }; })(node));

    var btnDel=document.createElement('button');
    btnDel.className='btn btn-del'; btnDel.textContent='×'; btnDel.title='Delete';
    btnDel.style.display=node.id===treeData.id?'none':'';
    btnDel.addEventListener('click',(function(n){ return function(){
      if(n.id===treeData.id) return; removeNode(treeData,n.id); render();
    }; })(node));

    el.appendChild(inp); el.appendChild(btnLink); el.appendChild(btnAdd); el.appendChild(btnDel);
    nodesDiv.appendChild(el);
  });

  requestAnimationFrame(function(){
    nodes.forEach(function(node){
      var el=nodesDiv.querySelector('[data-uid="'+node._uid+'"]');
      if(!el) return;
      el.style.top=(node._cy-el.offsetHeight/2)+'px';
    });
    requestAnimationFrame(drawLines);
  });
}

function repositionAndRedraw(){
  var lvWidths={};
  collectLevelWidths(treeData,0,lvWidths);
  var colX=buildColX(lvWidths);
  calcSubtreeHeight(treeData);
  placeNodes(treeData,0,PAD_Y,colX);
  var nodes=allNodes(treeData);
  var maxLv=Object.keys(lvWidths).length-1;
  var maxX=(colX[maxLv]||PAD_X)+(lvWidths[maxLv]||200)+PAD_X;
  nodesDiv.style.width=maxX+'px'; svg.setAttribute('width',maxX);
  nodes.forEach(function(node){
    var el=nodesDiv.querySelector('[data-uid="'+node._uid+'"]');
    if(!el) return;
    el.style.left=node._x+'px';
    el.style.top=(node._cy-el.offsetHeight/2)+'px';
  });
  drawLines();
}

function drawLines(){
  svg.innerHTML='';
  function getCoords(node){
    var el=nodesDiv.querySelector('[data-uid="'+node._uid+'"]');
    if(!el) return null;
    var left=parseFloat(el.style.left);
    var top=parseFloat(el.style.top);
    if(top<-100) return null;
    return { lx:left, rx:left+el.offsetWidth, cy:top+el.offsetHeight/2 };
  }
  function edges(node){
    if(!node.children.length) return;
    var pr=getCoords(node); if(!pr) return;
    var crs=node.children.map(getCoords).filter(Boolean);
    if(!crs.length) return;
    var midX=pr.rx+(crs[0].lx-pr.rx)/2;
    line(pr.rx,pr.cy,midX,pr.cy);
    if(crs.length===1){
      line(midX,crs[0].cy,crs[0].lx,crs[0].cy);
    } else {
      line(midX,crs[0].cy,midX,crs[crs.length-1].cy);
      crs.forEach(function(cr){ line(midX,cr.cy,cr.lx,cr.cy); });
    }
    node.children.forEach(edges);
  }
  edges(treeData);
}

function line(x1,y1,x2,y2){
  var l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke','#94a3b8'); l.setAttribute('stroke-width','2'); l.setAttribute('stroke-linecap','round');
  svg.appendChild(l);
}

// ── Snapshot ──────────────────────────────────────────────────────────────────
document.getElementById('btn-snap').addEventListener('click',function(){
  var btns=nodesDiv.querySelectorAll('.btn');
  btns.forEach(function(b){ b.style.display='none'; });
  var fullW=parseInt(nodesDiv.style.width)||nodesDiv.scrollWidth;
  var fullH=parseInt(nodesDiv.style.height)||nodesDiv.scrollHeight;
  var PAD=40;
  var container=document.createElement('div');
  container.style.cssText='position:fixed;top:0;left:0;width:'+(fullW+PAD*2)+'px;height:'+(fullH+PAD*2)+'px;background:#f0f4f8;overflow:visible;z-index:-9999;pointer-events:none;';
  var nodesClone=nodesDiv.cloneNode(true);
  nodesClone.style.position='absolute'; nodesClone.style.top=PAD+'px'; nodesClone.style.left=PAD+'px';
  nodesClone.style.width=fullW+'px'; nodesClone.style.height=fullH+'px';
  nodesClone.querySelectorAll('.btn').forEach(function(b){ b.remove(); });
  container.appendChild(nodesClone);
  var svgNS='http://www.w3.org/2000/svg';
  var svgClone=document.createElementNS(svgNS,'svg');
  svgClone.setAttribute('width',fullW+PAD*2); svgClone.setAttribute('height',fullH+PAD*2);
  svgClone.style.cssText='position:absolute;top:0;left:0;pointer-events:none;';
  function getCoords(node){
    var el=nodesDiv.querySelector('[data-uid="'+node._uid+'"]');
    if(!el) return null;
    var left=parseFloat(el.style.left), top=parseFloat(el.style.top);
    if(top<-100) return null;
    return { lx:left+PAD, rx:left+el.offsetWidth+PAD, cy:top+el.offsetHeight/2+PAD };
  }
  function addLine(x1,y1,x2,y2){
    var l=document.createElementNS(svgNS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke','#94a3b8'); l.setAttribute('stroke-width','2'); l.setAttribute('stroke-linecap','round');
    svgClone.appendChild(l);
  }
  function edges(node){
    if(!node.children.length) return;
    var pr=getCoords(node); if(!pr) return;
    var crs=node.children.map(getCoords).filter(Boolean);
    if(!crs.length) return;
    var midX=pr.rx+(crs[0].lx-pr.rx)/2;
    addLine(pr.rx,pr.cy,midX,pr.cy);
    if(crs.length===1){ addLine(midX,crs[0].cy,crs[0].lx,crs[0].cy); }
    else { addLine(midX,crs[0].cy,midX,crs[crs.length-1].cy); crs.forEach(function(cr){ addLine(midX,cr.cy,cr.lx,cr.cy); }); }
    node.children.forEach(edges);
  }
  edges(treeData);
  container.appendChild(svgClone);
  document.body.appendChild(container);
  requestAnimationFrame(function(){
    html2canvas(container,{backgroundColor:'#f0f4f8',scale:2,useCORS:true,width:fullW+PAD*2,height:fullH+PAD*2,scrollX:0,scrollY:0}).then(function(canvas){
      document.body.removeChild(container);
      btns.forEach(function(b){ b.style.display=''; });
      var a=document.createElement('a'); a.download='TMS_tree.png'; a.href=canvas.toDataURL('image/png'); a.click();
      flash('snap-msg');
    });
  });
});

function buildExport(){
  var clone=document.documentElement.cloneNode(true);
  var cn=clone.querySelector('#nodes-layer'); if(cn) cn.innerHTML='';
  var cs=clone.querySelector('#svg-layer'); if(cs) cs.innerHTML='';
  clone.querySelectorAll('script').forEach(function(scr){
    if(scr.innerHTML.includes('// TREE_DATA_START')){
      scr.innerHTML=scr.innerHTML.replace(
        /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
        '// TREE_DATA_START\nvar treeData = '+JSON.stringify(cloneTree(treeData))+';\n// TREE_DATA_END'
      );
    }
  });
  return '<!DOCTYPE html>\n'+clone.outerHTML;
}

function flash(id){ var el=document.getElementById(id); el.style.opacity='1'; setTimeout(function(){ el.style.opacity='0'; },2000); }

document.getElementById('btn-save').addEventListener('click',function(){
  var blob=new Blob([buildExport()],{type:'text/html'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tms_tree.html'; a.click();
  flash('save-msg');
});
document.getElementById('btn-copy').addEventListener('click',function(){
  navigator.clipboard.writeText(buildExport()).then(function(){ flash('copy-msg'); });
});

wrap.addEventListener('scroll',drawLines);
window.addEventListener('resize',render);
render();
</script>


</body></html>
