<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS Project Tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 30px 20px; }
h1 { text-align: center; color: #1e3a5f; margin-bottom: 6px; font-size: 22px; }
.subtitle { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 14px; }
.subtitle span { margin: 0 10px; }
#toolbar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
.tool-btn { border: none; border-radius: 8px; padding: 9px 20px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
#btn-save { background: #1e3a5f; color: #fff; }
#btn-save:hover { background: #2563eb; }
#btn-copy { background: #fff; color: #1e3a5f; border: 2px solid #3b82f6; }
#btn-copy:hover { background: #eff6ff; }
#btn-snap { background: #7c3aed; color: #fff; }
#btn-snap:hover { background: #6d28d9; }
.flash { font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
#save-msg { color: #16a34a; }
#copy-msg { color: #2563eb; }
#snap-msg { color: #7c3aed; }
#canvas-wrap { position: relative; overflow: auto; }
#svg-layer { position: absolute; top: 0; left: 0; pointer-events: none; }
#nodes-layer { position: relative; }
.node {
  position: absolute;
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 10px; padding: 7px 12px;
  font-weight: 600; font-size: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12); white-space: nowrap;
}
.lv0 { background: #1e3a5f; color: #fff; font-size: 16px; padding: 10px 18px; }
.lv1 { background: #2563eb; color: #fff; }
.lv2 { background: #fff; color: #1e3a5f; border: 2px solid #3b82f6; }
.lv3 { background: #f0fdf4; color: #166634; border: 2px solid #4ade80; }
.lv4 { background: #fefce8; color: #713f12; border: 2px solid #facc15; }
.node-input {
  border: none; outline: none; background: transparent;
  color: inherit; font: inherit; text-align: center;
  min-width: 20px; width: auto;
}
.node-input:focus { border-bottom: 1px dashed rgba(255,255,255,0.5); }
.lv2 .node-input:focus, .lv3 .node-input:focus, .lv4 .node-input:focus { border-bottom-color: #3b82f6; }
.btn { background: none; border: none; cursor: pointer; font-size: 13px; padding: 1px 4px; border-radius: 4px; opacity: 0.75; line-height: 1; }
.btn:hover { opacity: 1; }
.btn-add { color: #86efac; }
.lv2 .btn-add, .lv3 .btn-add, .lv4 .btn-add { color: #2563eb; }
.btn-del { color: #fca5a5; }
.lv2 .btn-del, .lv3 .btn-del, .lv4 .btn-del { color: #ef4444; }
#sizer {
  position: absolute; visibility: hidden; white-space: pre;
  font-weight: 600; font-size: 14px;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  top: -9999px; left: -9999px;
}
</style>
</head>
<body>
<h1>📋 TMS Project Tree</h1>
<div class="subtitle">
  <span>✏️ Click label to rename</span>
  <span>➕ add child</span>
  <span>🗑️ delete node</span>
</div>
<div id="toolbar">
  <button class="tool-btn" id="btn-save">💾 Save as file</button>
  <span class="flash" id="save-msg">✓ Downloaded!</span>
  <button class="tool-btn" id="btn-copy">📋 Copy to clipboard</button>
  <span class="flash" id="copy-msg" style="opacity: 0;">✓ Copied!</span>
  <button class="tool-btn" id="btn-snap">📸 Export as image</button>
  <span class="flash" id="snap-msg">✓ Image saved!</span>
</div>
<div id="canvas-wrap" style="height: 533px;">
  <svg id="svg-layer" width="1082" height="856"></svg>
  <div id="nodes-layer" style="width: 1082px; height: 856px;"></div>
</div>
<span id="sizer" style="font-size: 14px;">Multidrops GE/UK</span>

<script>
// TREE_DATA_START
var treeData = {"id":1,"label":"TMS","children":[{"id":2,"label":"Transport","children":[{"id":4,"label":"Learning","children":[]},{"id":5,"label":"Planning/projects","children":[]},{"id":505,"label":"Unrouteable by filter/country","children":[]},{"id":507,"label":"NO_NER","children":[]},{"id":508,"label":"RUSH","children":[]},{"id":509,"label":"Trailer activites UK","children":[]}]},{"id":3,"label":"Admin","children":[{"id":6,"label":"Learning","children":[{"id":10,"label":"Onboarding","children":[]}]},{"id":7,"label":"Projects","children":[]},{"id":8,"label":"Dashboards","children":[]}]},{"id":9,"label":"Technical Documentation","children":[{"id":501,"label":"Optimization Strategy","children":[{"id":503,"label":"Optimization Parameters","children":[]}]},{"id":502,"label":"SPOTBUY full Process map","children":[]},{"id":504,"label":"LC","children":[]},{"id":506,"label":"DVA","children":[]},{"id":510,"label":"DF","children":[]},{"id":511,"label":"Multidrops GE/UK","children":[]}]}]};
// TREE_DATA_END

var COL_GAP = 40;  // gap between columns (after the widest node in prev column)
var V_GAP   = 14;  // vertical gap between siblings
var PAD_X   = 60;  // left padding
var PAD_Y   = 60;  // top padding
var NODE_H  = 36;  // approximate node height for subtree calc
var nextId  = 600;

var svg      = document.getElementById('svg-layer');
var nodesDiv = document.getElementById('nodes-layer');
var wrap     = document.getElementById('canvas-wrap');
var sizer    = document.getElementById('sizer');

// ── Text measurement ──────────────────────────────────────────────────────────
function measureText(text, lv) {
  sizer.style.fontSize = (lv===0?16:14)+'px';
  sizer.textContent    = text||' ';
  // node width = text + buttons (~50px) + padding (~26px)
  return sizer.offsetWidth + 76;
}
function fitInput(inp, lv) {
  sizer.style.fontSize = (lv===0?16:14)+'px';
  sizer.textContent    = inp.value||' ';
  inp.style.width      = Math.max(sizer.offsetWidth, 20)+'px';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function allNodes(n,a){ a=a||[]; a.push(n); n.children.forEach(function(c){ allNodes(c,a); }); return a; }
function cloneTree(n){ return {id:n.id,label:n.label,children:n.children.map(cloneTree)}; }
function removeNode(n,id){
  n.children=n.children.filter(function(c){ return c.id!==id; });
  n.children.forEach(function(c){ removeNode(c,id); });
}

// ── Compute max node width per level ─────────────────────────────────────────
function collectLevelWidths(n, lv, map) {
  var w = measureText(n.label, lv);
  map[lv] = Math.max(map[lv]||0, w);
  n.children.forEach(function(c){ collectLevelWidths(c, lv+1, map); });
}

// Build cumulative X positions for each level:
// colX[lv] = left edge of nodes at this level
function buildColX(map) {
  var colX = [PAD_X];
  var maxLv = Object.keys(map).length;
  for (var lv=1; lv<maxLv; lv++) {
    colX[lv] = colX[lv-1] + (map[lv-1]||0) + COL_GAP;
  }
  return colX;
}

// ── Layout ────────────────────────────────────────────────────────────────────
function calcSubtreeHeight(n) {
  if (!n.children.length){ n._sh=NODE_H; return; }
  n.children.forEach(calcSubtreeHeight);
  var total=n.children.reduce(function(s,c){ return s+c._sh; },0)+V_GAP*(n.children.length-1);
  n._sh=Math.max(NODE_H,total);
}

function placeNodes(n, lv, yTop, colX) {
  n._lv  = lv;
  n._x   = colX[lv] !== undefined ? colX[lv] : PAD_X + lv*200;
  n._cy  = yTop + n._sh/2;
  if (!n.children.length) return;
  var y = yTop;
  n.children.forEach(function(c){ placeNodes(c, lv+1, y, colX); y+=c._sh+V_GAP; });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  nodesDiv.innerHTML=''; svg.innerHTML='';

  // 1. Compute per-level max widths → column X positions
  var lvWidths = {};
  collectLevelWidths(treeData, 0, lvWidths);
  var colX = buildColX(lvWidths);

  // 2. Layout
  calcSubtreeHeight(treeData);
  placeNodes(treeData, 0, PAD_Y, colX);

  var nodes = allNodes(treeData);
  var maxLv = Object.keys(lvWidths).length - 1;
  var lastColX = colX[maxLv] || PAD_X;
  var maxX = lastColX + (lvWidths[maxLv]||200) + PAD_X;
  var maxY = 0;
  nodes.forEach(function(n){ maxY=Math.max(maxY, n._cy+NODE_H/2+PAD_Y); });

  nodesDiv.style.width  = maxX+'px';
  nodesDiv.style.height = maxY+'px';
  svg.setAttribute('width',  maxX);
  svg.setAttribute('height', maxY);
  wrap.style.height = Math.min(maxY+4, window.innerHeight-200)+'px';

  // 3. Build DOM nodes
  nodes.forEach(function(node){
    var lv = Math.min(node._lv,4);
    var el = document.createElement('div');
    el.className='node lv'+lv;
    el.setAttribute('data-id', node.id);
    el.style.left = node._x+'px';
    el.style.top  = '-9999px'; // positioned after append

    var inp=document.createElement('input');
    inp.className='node-input'; inp.value=node.label;
    fitInput(inp, node._lv);
    inp.addEventListener('input',(function(n,i){ return function(){
      n.label=i.value; fitInput(i,n._lv);
      requestAnimationFrame(function(){ requestAnimationFrame(repositionAndRedraw); });
    }; })(node,inp));

    var btnAdd=document.createElement('button');
    btnAdd.className='btn btn-add'; btnAdd.textContent='＋'; btnAdd.title='Add child';
    btnAdd.addEventListener('click',(function(n){ return function(){
      n.children.push({id:nextId++,label:'New Item',children:[]});
      render();
      setTimeout(function(){ var all=nodesDiv.querySelectorAll('.node-input'); if(all.length) all[all.length-1].focus(); },50);
    }; })(node));

    var btnDel=document.createElement('button');
    btnDel.className='btn btn-del'; btnDel.textContent='×'; btnDel.title='Delete';
    btnDel.style.display=node.id===treeData.id?'none':'';
    btnDel.addEventListener('click',(function(n){ return function(){
      if(n.id===treeData.id) return; removeNode(treeData,n.id); render();
    }; })(node));

    el.appendChild(inp); el.appendChild(btnAdd); el.appendChild(btnDel);
    nodesDiv.appendChild(el);
  });

  // 4. After paint, set precise vertical position using actual offsetHeight
  requestAnimationFrame(function(){
    nodes.forEach(function(node){
      var el=nodesDiv.querySelector('[data-id="'+node.id+'"]');
      if (!el) return;
      el.style.top = (node._cy - el.offsetHeight/2)+'px';
    });
    requestAnimationFrame(drawLines);
  });
}

// ── Reposition on label change ────────────────────────────────────────────────
function repositionAndRedraw() {
  var lvWidths={};
  collectLevelWidths(treeData,0,lvWidths);
  var colX=buildColX(lvWidths);
  calcSubtreeHeight(treeData);
  placeNodes(treeData,0,PAD_Y,colX);
  var nodes=allNodes(treeData);
  var maxLv=Object.keys(lvWidths).length-1;
  var maxX=(colX[maxLv]||PAD_X)+(lvWidths[maxLv]||200)+PAD_X;
  var maxY=0;
  nodes.forEach(function(n){ maxY=Math.max(maxY,n._cy+NODE_H/2+PAD_Y); });
  nodesDiv.style.width=maxX+'px'; svg.setAttribute('width',maxX);
  nodes.forEach(function(node){
    var el=nodesDiv.querySelector('[data-id="'+node.id+'"]');
    if (!el) return;
    el.style.left=node._x+'px';
    el.style.top=(node._cy-el.offsetHeight/2)+'px';
  });
  drawLines();
}

// ── Draw connectors ───────────────────────────────────────────────────────────
function drawLines() {
  svg.innerHTML='';
  function getCoords(node){
    var el=nodesDiv.querySelector('[data-id="'+node.id+'"]');
    if (!el) return null;
    var left=parseFloat(el.style.left);
    var top =parseFloat(el.style.top);
    return { lx:left, rx:left+el.offsetWidth, cy:top+el.offsetHeight/2 };
  }
  function edges(node){
    if (!node.children.length) return;
    var pr=getCoords(node); if (!pr) return;
    var crs=node.children.map(getCoords).filter(Boolean);
    if (!crs.length) return;
    var midX=pr.rx+(crs[0].lx-pr.rx)/2;
    line(pr.rx, pr.cy, midX, pr.cy);
    if (crs.length===1){
      line(midX, crs[0].cy, crs[0].lx, crs[0].cy);
    } else {
      line(midX, crs[0].cy, midX, crs[crs.length-1].cy);
      crs.forEach(function(cr){ line(midX, cr.cy, cr.lx, cr.cy); });
    }
    node.children.forEach(edges);
  }
  edges(treeData);
}

function line(x1,y1,x2,y2){
  var l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1);
  l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke','#94a3b8'); l.setAttribute('stroke-width','2');
  l.setAttribute('stroke-linecap','round');
  svg.appendChild(l);
}

// ── Snapshot ──────────────────────────────────────────────────────────────────
document.getElementById('btn-snap').addEventListener('click', function(){
  var btns=nodesDiv.querySelectorAll('.btn');
  btns.forEach(function(b){ b.style.display='none'; });
  var prevOverflow=wrap.style.overflow, prevHeight=wrap.style.height;
  wrap.style.overflow='visible'; wrap.style.height='auto';
  var W=parseInt(nodesDiv.style.width)+60, H=parseInt(nodesDiv.style.height)+60;
  html2canvas(wrap,{backgroundColor:'#f0f4f8',scale:2,useCORS:true,scrollX:0,scrollY:0,width:W,height:H}).then(function(canvas){
    wrap.style.overflow=prevOverflow; wrap.style.height=prevHeight;
    btns.forEach(function(b){ b.style.display=''; });
    var a=document.createElement('a');
    a.download='TMS_tree.png'; a.href=canvas.toDataURL('image/png'); a.click();
    flash('snap-msg');
  });
});

// ── Export HTML ───────────────────────────────────────────────────────────────
function buildExport(){
  var tree=JSON.stringify(cloneTree(treeData));
  var xhr=new XMLHttpRequest(); xhr.open('GET',window.location.href,false);
  try{
    xhr.send();
    if(xhr.status===200){
      return xhr.responseText.replace(
        /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
        '// TREE_DATA_START\nvar treeData = '+tree+';\n// TREE_DATA_END'
      );
    }
  }catch(e){}
  var clone=document.documentElement.cloneNode(true);
  clone.querySelector('#nodes-layer').innerHTML='';
  clone.querySelector('#svg-layer').innerHTML='';
  var html='<!DOCTYPE html>\n'+clone.outerHTML;
  return html.replace(
    /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
    '// TREE_DATA_START\nvar treeData = '+tree+';\n// TREE_DATA_END'
  );
}

function flash(id){
  var el=document.getElementById(id);
  el.style.opacity='1';
  setTimeout(function(){ el.style.opacity='0'; },2000);
}

document.getElementById('btn-save').addEventListener('click',function(){
  var blob=new Blob([buildExport()],{type:'text/html'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tms_tree.html'; a.click();
  flash('save-msg');
});
document.getElementById('btn-copy').addEventListener('click',function(){
  navigator.clipboard.writeText(buildExport()).then(function(){ flash('copy-msg'); });
});

wrap.addEventListener('scroll', drawLines);
window.addEventListener('resize', render);
render();
</script>


</body></html>
