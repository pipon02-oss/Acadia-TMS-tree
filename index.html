<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS Project Tree</title>

<style>
/* (UNCHANGED STYLES – your original) */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; padding: 30px 20px; }

h1 { text-align: center; color: #1e3a5f; margin-bottom: 6px; font-size: 22px; }
.subtitle { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 14px; }

#toolbar { text-align: center; margin-bottom: 24px; }

#canvas-wrap { position: relative; overflow: auto; }
#svg-layer { position: absolute; top: 0; left: 0; pointer-events: none; }
#nodes-layer { position: relative; }

.node {
  position: absolute;
  display: inline-flex; gap: 5px; align-items: center;
  border-radius: 10px; padding: 8px 13px;
  font-weight: 600; font-size: 14px;
  transform: translateX(-50%);
}

.lv0 { background:#1e3a5f; color:#fff; }
.lv1 { background:#2563eb; color:#fff; }
.lv2 { background:#fff; color:#1e3a5f; border:2px solid #3b82f6; }
.lv3 { background:#f0fdf4; color:#166534; border:2px solid #4ade80; }
.lv4 { background:#fefce8; color:#713f12; border:2px solid #facc15; }

.node-input {
  border: none; outline: none; background: transparent;
  color: inherit; text-align: center;
}

.btn { cursor:pointer; }
</style>
</head>

<body>

<h1>📋 TMS Project Tree</h1>

<div id="toolbar">
  <button id="btn-save">💾 Save</button>
  <button id="btn-copy">📋 Copy</button>
</div>

<div id="canvas-wrap">
  <svg id="svg-layer"></svg>
  <div id="nodes-layer"></div>
</div>

<script>
// TREE_DATA_START
const root = {"id":1,"label":"TMS","children":[{"id":2,"label":"Transport","children":[{"id":4,"label":"Learning","children":[]},{"id":5,"label":"Planning/projects","children":[]}]},{"id":3,"label":"Admin","children":[{"id":6,"label":"Learning","children":[{"id":10,"label":"Onboarding","children":[]}]},{"id":7,"label":"Projects","children":[]},{"id":8,"label":"Dashboards","children":[]}]},{"id":9,"label":"Technical Documentation","children":[]}]};
// TREE_DATA_END

const V_GAP = 90, H_GAP = 50, PAD = 80;
let uid = 200;

const svgEl = document.getElementById('svg-layer');
const nodesLayer = document.getElementById('nodes-layer');
const canvasWrap = document.getElementById('canvas-wrap');
const domMap = new Map();

// ── helpers ─────────────────────
function traverse(node, fn){ fn(node); node.children.forEach(c=>traverse(c,fn)); }
function clean(node){ return {id:node.id,label:node.label,children:node.children.map(clean)};}
function deleteById(node,id){
  node.children = node.children.filter(c=>c.id!==id);
  node.children.forEach(c=>deleteById(c,id));
}

// ── layout ─────────────────────
const ctx = document.createElement('canvas').getContext('2d');
function textWidth(label, level){
  ctx.font = `600 ${level===0?16:14}px Segoe UI`;
  return ctx.measureText(label).width + 50;
}

function calc(node, lvl){
  node._lvl=lvl;
  node._w=textWidth(node.label,lvl);
  if(!node.children.length){ node._sw=node._w; return;}
  node.children.forEach(c=>calc(c,lvl+1));
  const span=node.children.reduce((s,c)=>s+c._sw,0)+H_GAP*(node.children.length-1);
  node._sw=Math.max(node._w,span);
}

function place(node,x,y){
  node._x=x; node._y=y;
  if(!node.children.length)return;
  let start=x-node._sw/2;
  node.children.forEach(c=>{
    place(c,start+c._sw/2,y+V_GAP);
    start+=c._sw+H_GAP;
  });
}

// ── render ─────────────────────
function render(){
  // 🔥 FIX: clear everything
  nodesLayer.innerHTML='';
  svgEl.innerHTML='';
  domMap.clear();

  calc(root,0);
  place(root,0,0);

  let minX=Infinity,maxX=-Infinity,maxY=0;
  traverse(root,n=>{
    minX=Math.min(minX,n._x-n._sw/2);
    maxX=Math.max(maxX,n._x+n._sw/2);
    maxY=Math.max(maxY,n._y);
  });

  const shift=PAD-minX;
  traverse(root,n=>n._x+=shift);

  const w=maxX-minX+PAD*2;
  const h=maxY+100;

  nodesLayer.style.width=w+'px';
  nodesLayer.style.height=h+'px';
  svgEl.setAttribute('width',w);
  svgEl.setAttribute('height',h);

  traverse(root,node=>{
    const el=build(node);
    nodesLayer.appendChild(el);
    domMap.set(node.id,el);

    el.style.left=node._x+'px';
    el.style.top=node._y+'px';
    el.className=`node lv${Math.min(node._lvl,4)}`;
  });

  requestAnimationFrame(()=>requestAnimationFrame(drawLines));
}

function build(node){
  const el=document.createElement('div');

  const inp=document.createElement('input');
  inp.className='node-input';
  inp.value=node.label;
  inp.oninput=()=>{ node.label=inp.value; };

  const add=document.createElement('button');
  add.textContent='＋';
  add.className='btn';
  add.onclick=()=>{
    node.children.push({id:uid++,label:'New Item',children:[]});
    render();
  };

  const del=document.createElement('button');
  del.textContent='×';
  del.className='btn';
  del.onclick=()=>{
    if(node.id===root.id)return;
    deleteById(root,node.id);
    render();
  };

  el.append(inp,add);
  if(node!==root) el.append(del);

  return el;
}

// ── lines ─────────────────────
function drawLines(){
  svgEl.innerHTML='';
  function edge(n){
    const p=domMap.get(n.id).getBoundingClientRect();
    n.children.forEach(c=>{
      const ch=domMap.get(c.id).getBoundingClientRect();
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',p.left+p.width/2);
      l.setAttribute('y1',p.bottom);
      l.setAttribute('x2',ch.left+ch.width/2);
      l.setAttribute('y2',ch.top);
      l.setAttribute('stroke','#94a3b8');
      svgEl.appendChild(l);
      edge(c);
    });
  }
  edge(root);
}

// ── EXPORT (clean, no DOM duplication) ─────────────────────
function getCleanHTML(){
  const tree = JSON.stringify(clean(root));

  const clone = document.documentElement.cloneNode(true);

  // remove rendered nodes
  clone.querySelector('#nodes-layer').innerHTML='';
  clone.querySelector('#svg-layer').innerHTML='';

  // replace data
  clone.innerHTML = clone.innerHTML.replace(
    /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
    `// TREE_DATA_START\nconst root = ${tree};\n// TREE_DATA_END`
  );

  return '<!DOCTYPE html>\n' + clone.outerHTML;
}

document.getElementById('btn-save').onclick=()=>{
  const blob=new Blob([getCleanHTML()],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='tms_tree.html';
  a.click();
};

document.getElementById('btn-copy').onclick=()=>{
  navigator.clipboard.writeText(getCleanHTML());
};

// boot
render();
</script>

</body>
</html>
