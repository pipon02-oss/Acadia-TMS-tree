<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS Project Tree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 30px 20px; }

  h1 { text-align: center; color: #1e3a5f; margin-bottom: 6px; font-size: 22px; }
  .subtitle { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 14px; }
  .subtitle span { margin: 0 10px; }

  #toolbar {
    text-align: center; margin-bottom: 24px;
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .tool-btn {
    border: none; border-radius: 8px; padding: 9px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: background 0.15s;
  }
  #btn-save { background: #1e3a5f; color: #fff; }
  #btn-save:hover { background: #2563eb; }
  #btn-copy { background: #fff; color: #1e3a5f; border: 2px solid #3b82f6; }
  #btn-copy:hover { background: #eff6ff; }
  .flash { font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
  #save-msg { color: #16a34a; }
  #copy-msg { color: #2563eb; }

  #canvas-wrap { position: relative; overflow: auto; }
  #svg-layer   { position: absolute; top: 0; left: 0; pointer-events: none; }
  #nodes-layer { position: relative; }

  .node {
    position: absolute; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 10px; padding: 8px 13px;
    font-weight: 600; font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); white-space: nowrap;
  }
  .lv0 { background:#1e3a5f; color:#fff; font-size:16px; padding:10px 20px; }
  .lv1 { background:#2563eb; color:#fff; }
  .lv2 { background:#fff; color:#1e3a5f; border:2px solid #3b82f6; }
  .lv3 { background:#f0fdf4; color:#166534; border:2px solid #4ade80; }
  .lv4 { background:#fefce8; color:#713f12; border:2px solid #facc15; }

  .node-input {
    border: none; outline: none; background: transparent;
    color: inherit; font: inherit; text-align: center; min-width: 30px;
  }
  .node-input:focus { border-bottom: 1px dashed rgba(255,255,255,0.4); }
  .lv2 .node-input:focus, .lv3 .node-input:focus, .lv4 .node-input:focus { border-bottom-color: #3b82f6; }

  .btn { background:none; border:none; cursor:pointer; font-size:13px; padding:1px 3px; border-radius:4px; opacity:0.7; line-height:1; }
  .btn:hover { opacity:1; }
  .btn-add { color:#86efac; }
  .lv2 .btn-add, .lv3 .btn-add, .lv4 .btn-add { color:#2563eb; }
  .btn-del { color:#fca5a5; }
  .lv2 .btn-del, .lv3 .btn-del, .lv4 .btn-del { color:#ef4444; }
</style>
</head>
<body>

<h1>📋 TMS Project Tree</h1>
<div class="subtitle">
  <span>✏️ Click label to rename</span>
  <span>➕ add child</span>
  <span>🗑️ delete node</span>
</div>
<div id="toolbar">
  <button class="tool-btn" id="btn-save">💾 Save as file</button>
  <span class="flash" id="save-msg">✓ Downloaded!</span>
  <button class="tool-btn" id="btn-copy">📋 Copy to clipboard</button>
  <span class="flash" id="copy-msg">✓ Copied!</span>
</div>
<div id="canvas-wrap" style="height: 434px;">
  <svg id="svg-layer" width="1251.716796875" height="430"></svg>
  <div id="nodes-layer" style="width: 1251.72px; height: 430px;"></div>
</div>

<script>
// ── Tree data ─────────────────────────────────────────────────────────────────
// TREE_DATA_START
var treeData = {"id":1,"label":"TMS","children":[{"id":2,"label":"Transport","children":[{"id":4,"label":"Learning","children":[]},{"id":5,"label":"Planning/projects","children":[]}]},{"id":3,"label":"Admin","children":[{"id":6,"label":"Learning","children":[{"id":10,"label":"Onboarding","children":[]}]},{"id":7,"label":"Projects","children":[]},{"id":8,"label":"Dashboards","children":[]}]},{"id":9,"label":"Technical Documentation","children":[]}]};
// TREE_DATA_END

// ── Settings ──────────────────────────────────────────────────────────────────
var V_GAP = 90, H_GAP = 50, PAD = 80;
var nextId = 500;

var svg      = document.getElementById('svg-layer');
var nodesDiv = document.getElementById('nodes-layer');
var wrap     = document.getElementById('canvas-wrap');

// ── Helpers ───────────────────────────────────────────────────────────────────
function cloneData(node) {
  return { id: node.id, label: node.label, children: node.children.map(cloneData) };
}

function findAndDelete(node, id) {
  node.children = node.children.filter(function(c) { return c.id !== id; });
  node.children.forEach(function(c) { findAndDelete(c, id); });
}

function findNode(node, id) {
  if (node.id === id) return node;
  for (var i = 0; i < node.children.length; i++) {
    var found = findNode(node.children[i], id);
    if (found) return found;
  }
  return null;
}

function allNodes(node, list) {
  list = list || [];
  list.push(node);
  node.children.forEach(function(c) { allNodes(c, list); });
  return list;
}

// ── Layout: measure + position ────────────────────────────────────────────────
var measureCanvas = document.createElement('canvas').getContext('2d');

function measureLabel(label, level) {
  measureCanvas.font = '600 ' + (level === 0 ? 16 : 14) + 'px Segoe UI, Tahoma, sans-serif';
  return measureCanvas.measureText(label).width + (level === 0 ? 65 : 52);
}

function computeWidths(node, level) {
  node._lv = level;
  node._ow = measureLabel(node.label, level);
  if (node.children.length === 0) {
    node._sw = node._ow;
    return;
  }
  node.children.forEach(function(c) { computeWidths(c, level + 1); });
  var childSpan = node.children.reduce(function(s, c) { return s + c._sw; }, 0)
                + H_GAP * (node.children.length - 1);
  node._sw = Math.max(node._ow, childSpan);
}

function placeNodes(node, cx, y) {
  node._x = cx;
  node._y = y;
  if (node.children.length === 0) return;
  var span = node.children.reduce(function(s, c) { return s + c._sw; }, 0)
           + H_GAP * (node.children.length - 1);
  var x = cx - span / 2;
  node.children.forEach(function(c) {
    placeNodes(c, x + c._sw / 2, y + V_GAP);
    x += c._sw + H_GAP;
  });
}

// ── Render: wipe and redraw everything cleanly ────────────────────────────────
function render() {
  // 1. Compute layout
  computeWidths(treeData, 0);
  placeNodes(treeData, 0, 0);

  // 2. Find bounds and shift so nothing clips
  var nodes = allNodes(treeData);
  var minX = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(function(n) {
    minX = Math.min(minX, n._x - n._sw / 2);
    maxX = Math.max(maxX, n._x + n._sw / 2);
    maxY = Math.max(maxY, n._y);
  });
  var shiftX = PAD - minX;
  nodes.forEach(function(n) { n._x += shiftX; });

  var totalW = maxX - minX + PAD * 2;
  var totalH = maxY + 80 + PAD;

  // 3. Size the canvas
  nodesDiv.style.width  = totalW + 'px';
  nodesDiv.style.height = totalH + 'px';
  svg.setAttribute('width',  totalW);
  svg.setAttribute('height', totalH);
  wrap.style.height = (totalH + 4) + 'px';

  // 4. WIPE nodes layer completely, then rebuild from scratch
  nodesDiv.innerHTML = '';

  nodes.forEach(function(node) {
    var el = document.createElement('div');
    el.className = 'node lv' + Math.min(node._lv, 4);
    el.style.left = node._x + 'px';
    el.style.top  = node._y + 'px';
    el.dataset.id = node.id;

    // Label input
    var inp = document.createElement('input');
    inp.className = 'node-input';
    inp.value = node.label;
    inp.style.width = '0';
    inp.style.width = (inp.scrollWidth + 2) + 'px';

    inp.addEventListener('input', function() {
      node.label = inp.value;
      inp.style.width = '0';
      inp.style.width = (inp.scrollWidth + 2) + 'px';
      // Just redraw lines on label change (no full re-render needed)
      requestAnimationFrame(function() { requestAnimationFrame(drawLines); });
    });

    // Add child button
    var btnAdd = document.createElement('button');
    btnAdd.className = 'btn btn-add';
    btnAdd.textContent = '＋';
    btnAdd.title = 'Add child';
    btnAdd.addEventListener('click', function() {
      node.children.push({ id: nextId++, label: 'New Item', children: [] });
      render();
      // Focus the new input after render
      setTimeout(function() {
        var inputs = nodesDiv.querySelectorAll('.node-input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      }, 50);
    });

    // Delete button
    var btnDel = document.createElement('button');
    btnDel.className = 'btn btn-del';
    btnDel.textContent = '×';
    btnDel.title = 'Delete node';
    btnDel.style.display = (node.id === treeData.id) ? 'none' : '';
    btnDel.addEventListener('click', function() {
      findAndDelete(treeData, node.id);
      render();
    });

    el.appendChild(inp);
    el.appendChild(btnAdd);
    el.appendChild(btnDel);
    nodesDiv.appendChild(el);
  });

  // 5. Draw connector lines after DOM paint
  requestAnimationFrame(function() { requestAnimationFrame(drawLines); });
}

// ── Draw SVG connector lines using real DOM positions ─────────────────────────
function drawLines() {
  svg.innerHTML = '';
  var wrapRect = wrap.getBoundingClientRect();
  var sx = wrap.scrollLeft, sy = wrap.scrollTop;

  function nodeRect(node) {
    var el = nodesDiv.querySelector('[data-id="' + node.id + '"]');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return {
      cx:  r.left - wrapRect.left + r.width / 2 + sx,
      top: r.top  - wrapRect.top               + sy,
      bot: r.top  - wrapRect.top  + r.height   + sy
    };
  }

  function drawEdges(node) {
    if (!node.children.length) return;
    var pr = nodeRect(node);
    if (!pr) return;

    var childRects = node.children.map(nodeRect).filter(Boolean);
    if (!childRects.length) return;

    var midY = pr.bot + (childRects[0].top - pr.bot) / 2;

    // Vertical stem down from parent
    line(pr.cx, pr.bot, pr.cx, midY);

    if (childRects.length === 1) {
      line(pr.cx, midY, childRects[0].cx, childRects[0].top);
    } else {
      // Horizontal bar between first and last child only
      line(childRects[0].cx, midY, childRects[childRects.length - 1].cx, midY);
      // Vertical drop to each child
      childRects.forEach(function(cr) { line(cr.cx, midY, cr.cx, cr.top); });
    }

    node.children.forEach(drawEdges);
  }

  drawEdges(treeData);
}

function line(x1, y1, x2, y2) {
  var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  l.setAttribute('stroke', '#94a3b8');
  l.setAttribute('stroke-width', '2');
  l.setAttribute('stroke-linecap', 'round');
  svg.appendChild(l);
}

// ── Export: build a clean HTML string with current data ───────────────────────
function buildExportHTML() {
  // Get the original page source from the template script tag
  // We build it from the static parts of this file, injecting only the data
  var treeJson = JSON.stringify(cloneData(treeData));

  // Grab the full page source and replace only the data line
  var xhr = new XMLHttpRequest();
  xhr.open('GET', window.location.href, false); // sync
  try {
    xhr.send();
    if (xhr.status === 200) {
      return xhr.responseText.replace(
        /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
        '// TREE_DATA_START\nvar treeData = ' + treeJson + ';\n// TREE_DATA_END'
      );
    }
  } catch(e) {}

  // Fallback: if XHR fails (e.g. file:// protocol), use outerHTML but clean nodes-layer
  var clone = document.documentElement.cloneNode(true);
  clone.querySelector('#nodes-layer').innerHTML = '';
  clone.querySelector('#svg-layer').innerHTML = '';
  var html = '<!DOCTYPE html>\n' + clone.outerHTML;
  return html.replace(
    /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
    '// TREE_DATA_START\nvar treeData = ' + treeJson + ';\n// TREE_DATA_END'
  );
}

// ── Save as file ──────────────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', function() {
  var html = buildExportHTML();
  var blob = new Blob([html], { type: 'text/html' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'tms_tree.html'; a.click();
  URL.revokeObjectURL(url);
  flash('save-msg');
});

// ── Copy to clipboard ─────────────────────────────────────────────────────────
document.getElementById('btn-copy').addEventListener('click', function() {
  var html = buildExportHTML();
  navigator.clipboard.writeText(html).then(function() { flash('copy-msg'); });
});

function flash(id) {
  var el = document.getElementById(id);
  el.style.opacity = '1';
  setTimeout(function() { el.style.opacity = '0'; }, 2000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
render();
window.addEventListener('resize', function() { render(); });
wrap.addEventListener('scroll', drawLines);
</script>


</body></html>
