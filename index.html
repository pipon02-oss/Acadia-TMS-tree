<script>
// TREE_DATA_START
var treeData = {"id":1,"label":"TMS","url":"","children":[{"id":2,"label":"Transport","url":"","children":[{"id":5,"label":"Planning/projects","url":"","children":[{"id":122,"label":"NO_NER","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500805/en-us","children":[]},{"id":123,"label":"RUSH","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500808/en-us","children":[]},{"id":124,"label":"Trailer Activities UK","url":"","children":[]},{"id":152,"label":"Multidrops","url":"","children":[{"id":155,"label":"GE","url":"","children":[]},{"id":156,"label":"UK","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500815/en-us","children":[]}]},{"id":153,"label":"Lane Constraints","url":"","children":[]},{"id":154,"label":"Dedicated Fleet","url":"","children":[]}]},{"id":125,"label":"JOBSERVER","url":"","children":[]},{"id":157,"label":"Learning","url":"","children":[{"id":158,"label":"Onboarding","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500757/en-us","children":[]}]}]},{"id":3,"label":"Admin","url":"","children":[{"id":6,"label":"Learning","url":"","children":[{"id":106,"label":"Onboarding","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500802/en-us","children":[]},{"id":121,"label":"Extra Charges + Stops","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500766/en-us","children":[]},{"id":144,"label":"Distance and Fuel Surcharge","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500776/en-us","children":[]},{"id":145,"label":"Tariff and Master Data","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500780/en-us","children":[]},{"id":147,"label":"Rating Issues guide","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500792/en-us","children":[]},{"id":148,"label":"Self Billing issues and output","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500796/en-us","children":[]},{"id":149,"label":"Billing Proposal guide","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500799/en-us","children":[]},{"id":151,"label":"Zone Creation via Template","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500801/en-us","children":[]}]},{"id":107,"label":"Projects","url":"","children":[]},{"id":108,"label":"Dashboards","url":"","children":[]}]},{"id":128,"label":"Technical Documentation","url":"","children":[{"id":129,"label":"System","url":"","children":[{"id":132,"label":"Optimization","url":"","children":[{"id":133,"label":"Strategy","url":"","children":[]},{"id":134,"label":"Parameters","url":"","children":[]}]}]},{"id":130,"label":"TP","url":"","children":[{"id":135,"label":"SPOTBUY Process Map","url":"","children":[{"id":136,"label":"TMS","url":"https://ab-inbev.acadia.sysalli.com/browse/ZLOG-500810/en-us","children":[]},{"id":137,"label":"TNX","url":"","children":[]}]},{"id":138,"label":"CEA grouping","url":"","children":[]},{"id":139,"label":"DVA","url":"","children":[]}]},{"id":131,"label":"Admin","url":"","children":[]}]}]};
// TREE_DATA_END

var COL_GAP=40,V_GAP=14,PAD_X=60,PAD_Y=60,NODE_H=36;
var nextId=200,currentZoom=1.0,ZOOM_STEP=0.1,ZOOM_MIN=0.3,ZOOM_MAX=2.0;
var svg=document.getElementById('svg-layer');
var nodesDiv=document.getElementById('nodes-layer');
var wrap=document.getElementById('canvas-wrap');
var zoomLayer=document.getElementById('zoom-layer');
var sizer=document.getElementById('sizer');

var _uidCounter=1;
function ensureUids(n){ if(!n._uid) n._uid='u'+(_uidCounter++); n.children.forEach(ensureUids); }
ensureUids(treeData);
function maxId(n){ var m=n.id; n.children.forEach(function(c){ m=Math.max(m,maxId(c)); }); return m; }
nextId=maxId(treeData)+1;

var parentMap={};
function buildParentMap(n){ n.children.forEach(function(c){ parentMap[c._uid]=n; buildParentMap(c); }); }

function applyZoom(z){
  currentZoom=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,z));
  zoomLayer.style.transform='scale('+currentZoom+')';
  var baseH=parseInt(nodesDiv.style.height)||400;
  wrap.style.height=Math.min(baseH*currentZoom+4,window.innerHeight-260)+'px';
  document.getElementById('zoom-label').textContent=Math.round(currentZoom*100)+'%';
}
function fitZoom(){
  var treeW=parseInt(nodesDiv.style.width)||800;
  var treeH=parseInt(nodesDiv.style.height)||400;
  var z=Math.min((wrap.parentElement.clientWidth-40)/treeW,(window.innerHeight-300)/treeH,1.0);
  applyZoom(Math.floor(z*10)/10);
}
document.getElementById('btn-zoom-in').addEventListener('click',function(){ applyZoom(currentZoom+ZOOM_STEP); });
document.getElementById('btn-zoom-out').addEventListener('click',function(){ applyZoom(currentZoom-ZOOM_STEP); });
document.getElementById('btn-zoom-fit').addEventListener('click',fitZoom);
wrap.addEventListener('wheel',function(e){ if(!e.ctrlKey) return; e.preventDefault(); applyZoom(currentZoom+(e.deltaY<0?ZOOM_STEP:-ZOOM_STEP)); },{passive:false});

function measureText(text,lv){ sizer.style.fontSize=(lv===0?16:14)+'px'; sizer.textContent=text||' '; return sizer.offsetWidth+130; }
function fitInput(inp,lv){ sizer.style.fontSize=(lv===0?16:14)+'px'; sizer.textContent=inp.value||' '; inp.style.width=Math.max(sizer.offsetWidth,20)+'px'; }
function allNodes(n,a){ a=a||[]; a.push(n); n.children.forEach(function(c){ allNodes(c,a); }); return a; }
function cloneTree(n){ return {id:n.id,label:n.label,url:n.url||'',children:n.children.map(cloneTree)}; }
function removeNode(n,id){ n.children=n.children.filter(function(c){ return c.id!==id; }); n.children.forEach(function(c){ removeNode(c,id); }); }
function collectLevelWidths(n,lv,map){ map[lv]=Math.max(map[lv]||0,measureText(n.label,lv)); n.children.forEach(function(c){ collectLevelWidths(c,lv+1,map); }); }
function buildColX(map){ var colX=[PAD_X],maxLv=Object.keys(map).length; for(var lv=1;lv<maxLv;lv++) colX[lv]=colX[lv-1]+(map[lv-1]||0)+COL_GAP; return colX; }
function calcSubtreeHeight(n){ if(!n.children.length){ n._sh=NODE_H; return; } n.children.forEach(calcSubtreeHeight); var total=n.children.reduce(function(s,c){ return s+c._sh; },0)+V_GAP*(n.children.length-1); n._sh=Math.max(NODE_H,total); }
function placeNodes(n,lv,yTop,colX){ n._lv=lv; n._x=colX[lv]; n._cy=yTop+n._sh/2; if(!n.children.length) return; var y=yTop; n.children.forEach(function(c){ placeNodes(c,lv+1,y,colX); y+=c._sh+V_GAP; }); }

var drag={active:false,node:null,el:null,startY:0,origTop:0,overUid:null,overPos:null};
function clearDropIndicators(){ nodesDiv.querySelectorAll('.drop-above,.drop-below').forEach(function(e){ e.classList.remove('drop-above','drop-below'); }); }
function startDrag(e,node,el){
  if(node.id===treeData.id) return;
  e.preventDefault();
  drag.active=true; drag.node=node; drag.el=el;
  drag.startY=e.clientY; drag.origTop=parseFloat(el.style.top);
  el.classList.add('dragging');
  document.addEventListener('mousemove',onDragMove);
  document.addEventListener('mouseup',onDragEnd);
}
function onDragMove(e){
  if(!drag.active) return;
  drag.el.style.top=(drag.origTop+(e.clientY-drag.startY)/currentZoom)+'px';
  var parent=parentMap[drag.node._uid]; if(!parent) return;
  clearDropIndicators(); drag.overUid=null; drag.overPos=null;
  var dragCY=parseFloat(drag.el.style.top)+drag.el.offsetHeight/2;
  var bestDist=Infinity;
  parent.children.forEach(function(sib){
    if(sib._uid===drag.node._uid) return;
    var se=nodesDiv.querySelector('[data-uid="'+sib._uid+'"]'); if(!se) return;
    var sibCY=parseFloat(se.style.top)+se.offsetHeight/2;
    var dist=Math.abs(dragCY-sibCY);
    if(dist<bestDist){ bestDist=dist; drag.overUid=sib._uid; drag.overPos=dragCY<sibCY?'above':'below'; }
  });
  if(drag.overUid){ var oe=nodesDiv.querySelector('[data-uid="'+drag.overUid+'"]'); if(oe) oe.classList.add(drag.overPos==='above'?'drop-above':'drop-below'); }
}
function onDragEnd(){
  if(!drag.active) return;
  document.removeEventListener('mousemove',onDragMove);
  document.removeEventListener('mouseup',onDragEnd);
  drag.el.classList.remove('dragging');
  clearDropIndicators();
  if(drag.overUid&&drag.overPos){
    var parent=parentMap[drag.node._uid];
    if(parent){
      var arr=parent.children;
      var fi=arr.findIndex(function(c){ return c._uid===drag.node._uid; });
      if(fi!==-1){ arr.splice(fi,1); var ti=arr.findIndex(function(c){ return c._uid===drag.overUid; }); if(ti!==-1) arr.splice(drag.overPos==='above'?ti:ti+1,0,drag.node); }
    }
  }
  drag.active=false; drag.node=null; drag.el=null; drag.overUid=null; drag.overPos=null;
  render();
}

function render(){
  nodesDiv.innerHTML=''; svg.innerHTML='';
  parentMap={}; buildParentMap(treeData);
  var lvWidths={};
  collectLevelWidths(treeData,0,lvWidths);
  var colX=buildColX(lvWidths);
  calcSubtreeHeight(treeData);
  placeNodes(treeData,0,PAD_Y,colX);
  var nodes=allNodes(treeData);
  var maxLv=Object.keys(lvWidths).length-1;
  var maxX=(colX[maxLv]||PAD_X)+(lvWidths[maxLv]||200)+PAD_X;
  var maxY=0;
  nodes.forEach(function(n){ maxY=Math.max(maxY,n._cy+NODE_H/2+PAD_Y); });
  nodesDiv.style.width=maxX+'px'; nodesDiv.style.height=maxY+'px';
  svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  applyZoom(currentZoom);

  nodes.forEach(function(node){
    var lv=Math.min(node._lv,4);
    var el=document.createElement('div');
    el.className='node lv'+lv+((lv>=2&&!node.url)?' no-link':'');
    el.setAttribute('data-uid',node._uid);
    el.style.left=node._x+'px'; el.style.top='-9999px';

    if(node.id!==treeData.id){
      var bd=document.createElement('button');
      bd.className='btn btn-drag'; bd.textContent='⠿'; bd.title='Drag to reorder';
      bd.addEventListener('mousedown',(function(n,e_){ return function(e){ startDrag(e,n,e_.closest('.node')); }; })(node,el));
      el.appendChild(bd);
    }

    var inp=document.createElement('input');
    inp.className='node-input'; inp.value=node.label;
    fitInput(inp,node._lv);
    inp.addEventListener('input',(function(n,i){ return function(){ n.label=i.value; fitInput(i,n._lv); requestAnimationFrame(function(){ requestAnimationFrame(repositionAndRedraw); }); }; })(node,inp));
    el.appendChild(inp);

    var bl=document.createElement('button');
    bl.className='btn'; bl.innerHTML='🔗'; bl.title='Open / Edit link'; bl.style.opacity=node.url?'1':'0.4';
    bl.addEventListener('click',(function(n,btn){ return function(e){
      e.stopPropagation();
      if(n.url){ if(confirm('Open existing link?\n\nOK = open\nCancel = edit')){ window.open(n.url,'_blank'); return; } }
      var u=prompt('Enter URL (empty to remove):',n.url||''); if(u===null) return;
      u=u.trim();
      if(u===''){ n.url=''; btn.style.opacity='0.4'; render(); return; }
      if(!/^https?:\/\//i.test(u)) u='https://'+u;
      n.url=u; btn.style.opacity='1'; render();
    }; })(node,bl));
    el.appendChild(bl);

    var ba=document.createElement('button');
    ba.className='btn btn-add'; ba.textContent='＋'; ba.title='Add child';
    ba.addEventListener('click',(function(n){ return function(){ var nn={id:nextId++,label:'New Item',url:'',children:[]}; ensureUids(nn); n.children.push(nn); render(); }; })(node));
    el.appendChild(ba);

    var bd2=document.createElement('button');
    bd2.className='btn btn-del'; bd2.textContent='×'; bd2.title='Delete';
    bd2.style.display=node.id===treeData.id?'none':'';
    bd2.addEventListener('click',(function(n){ return function(){ if(n.id===treeData.id) return; removeNode(treeData,n.id); render(); }; })(node));
    el.appendChild(bd2);

    nodesDiv.appendChild(el);
  });

  requestAnimationFrame(function(){
    nodes.forEach(function(node){
      var el=nodesDiv.querySelector('[data-uid="'+node._uid+'"]');
      if(!el) return;
      el.style.top=(node._cy-el.offsetHeight/2)+'px';
    });
    requestAnimationFrame(drawLines);
  });
}

function repositionAndRedraw(){
  var lvWidths={};
  collectLevelWidths(treeData,0,lvWidths);
  var colX=buildColX(lvWidths);
  calcSubtreeHeight(treeData);
  placeNodes(treeData,0,PAD_Y,colX);
  var nodes=allNodes(treeData);
  var maxLv=Object.keys(lvWidths).length-1;
  var maxX=(colX[maxLv]||PAD_X)+(lvWidths[maxLv]||200)+PAD_X;
  nodesDiv.style.width=maxX+'px'; svg.setAttribute('width',maxX);
  nodes.forEach(function(node){
    var el=nodesDiv.querySelector('[data-uid="'+node._uid+'"]');
    if(!el) return;
    el.style.left=node._x+'px';
    el.style.top=(node._cy-el.offsetHeight/2)+'px';
  });
  drawLines();
}

function drawLines(){
  svg.innerHTML='';
  function getCoords(node){
    var el=nodesDiv.querySelector('[data-uid="'+node._uid+'"]');
    if(!el) return null;
    var left=parseFloat(el.style.left),top=parseFloat(el.style.top);
    if(top<-100) return null;
    return {lx:left,rx:left+el.offsetWidth,cy:top+el.offsetHeight/2};
  }
  function edges(node){
    if(!node.children.length) return;
    var pr=getCoords(node); if(!pr) return;
    var crs=node.children.map(getCoords).filter(Boolean); if(!crs.length) return;
    var midX=pr.rx+(crs[0].lx-pr.rx)/2;
    line(pr.rx,pr.cy,midX,pr.cy);
    if(crs.length===1){ line(midX,crs[0].cy,crs[0].lx,crs[0].cy); }
    else{ line(midX,crs[0].cy,midX,crs[crs.length-1].cy); crs.forEach(function(cr){ line(midX,cr.cy,cr.lx,cr.cy); }); }
    node.children.forEach(edges);
  }
  edges(treeData);
}

function line(x1,y1,x2,y2){
  var l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke','#94a3b8'); l.setAttribute('stroke-width','2'); l.setAttribute('stroke-linecap','round');
  svg.appendChild(l);
}

document.getElementById('btn-snap').addEventListener('click',function(){
  var btns=nodesDiv.querySelectorAll('.btn');
  btns.forEach(function(b){ b.style.display='none'; });
  var fullW=parseInt(nodesDiv.style.width)||nodesDiv.scrollWidth;
  var fullH=parseInt(nodesDiv.style.height)||nodesDiv.scrollHeight;
  var PAD=40;
  var container=document.createElement('div');
  container.style.cssText='position:fixed;top:0;left:0;width:'+(fullW+PAD*2)+'px;height:'+(fullH+PAD*2)+'px;background:#f0f4f8;overflow:visible;z-index:-9999;pointer-events:none;';
  var nc=nodesDiv.cloneNode(true);
  nc.style.position='absolute'; nc.style.top=PAD+'px'; nc.style.left=PAD+'px';
  nc.style.width=fullW+'px'; nc.style.height=fullH+'px';
  nc.querySelectorAll('.btn').forEach(function(b){ b.remove(); });
  container.appendChild(nc);
  var ns='http://www.w3.org/2000/svg';
  var sc=document.createElementNS(ns,'svg');
  sc.setAttribute('width',fullW+PAD*2); sc.setAttribute('height',fullH+PAD*2);
  sc.style.cssText='position:absolute;top:0;left:0;pointer-events:none;';
  function gc(node){ var el=nodesDiv.querySelector('[data-uid="'+node._uid+'"]'); if(!el) return null; var l=parseFloat(el.style.left),t=parseFloat(el.style.top); if(t<-100) return null; return {lx:l+PAD,rx:l+el.offsetWidth+PAD,cy:t+el.offsetHeight/2+PAD}; }
  function al(x1,y1,x2,y2){ var l=document.createElementNS(ns,'line'); l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2); l.setAttribute('stroke','#94a3b8'); l.setAttribute('stroke-width','2'); l.setAttribute('stroke-linecap','round'); sc.appendChild(l); }
  function se(node){ if(!node.children.length) return; var pr=gc(node); if(!pr) return; var crs=node.children.map(gc).filter(Boolean); if(!crs.length) return; var mx=pr.rx+(crs[0].lx-pr.rx)/2; al(pr.rx,pr.cy,mx,pr.cy); if(crs.length===1){ al(mx,crs[0].cy,crs[0].lx,crs[0].cy); } else{ al(mx,crs[0].cy,mx,crs[crs.length-1].cy); crs.forEach(function(cr){ al(mx,cr.cy,cr.lx,cr.cy); }); } node.children.forEach(se); }
  se(treeData);
  container.appendChild(sc);
  document.body.appendChild(container);
  requestAnimationFrame(function(){
    html2canvas(container,{backgroundColor:'#f0f4f8',scale:2,useCORS:true,width:fullW+PAD*2,height:fullH+PAD*2,scrollX:0,scrollY:0}).then(function(canvas){
      document.body.removeChild(container);
      btns.forEach(function(b){ b.style.display=''; });
      var a=document.createElement('a'); a.download='TMS_tree.png'; a.href=canvas.toDataURL('image/png'); a.click();
      flash('snap-msg');
    });
  });
});

function buildExport(){
  var clone=document.documentElement.cloneNode(true);
  var cn=clone.querySelector('#nodes-layer'); if(cn) cn.innerHTML='';
  var cs=clone.querySelector('#svg-layer'); if(cs) cs.innerHTML='';
  clone.querySelectorAll('script').forEach(function(scr){
    if(scr.innerHTML.includes('// TREE_DATA_START')){
      scr.innerHTML=scr.innerHTML.replace(
        /\/\/ TREE_DATA_START[\s\S]*?\/\/ TREE_DATA_END/,
        '// TREE_DATA_START\nvar treeData = '+JSON.stringify(cloneTree(treeData))+';\n// TREE_DATA_END'
      );
    }
  });
  return '<!DOCTYPE html>\n'+clone.outerHTML;
}

function flash(id){ var el=document.getElementById(id); el.style.opacity='1'; setTimeout(function(){ el.style.opacity='0'; },2000); }

document.getElementById('btn-save').addEventListener('click',function(){
  var blob=new Blob([buildExport()],{type:'text/html'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tms_tree.html'; a.click();
  flash('save-msg');
});
document.getElementById('btn-copy').addEventListener('click',function(){
  navigator.clipboard.writeText(buildExport()).then(function(){ flash('copy-msg'); });
});

wrap.addEventListener('scroll',drawLines);
window.addEventListener('resize',render);
render();
</script>
